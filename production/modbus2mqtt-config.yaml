# modbus2mqtt configuration for production.
#
# Schema: flat top-level mqtt* keys (mqttserverurl, mqttcaFile, …).
# Nested {mqtt: {url: …}} wird vom App ignoriert und triggert
# "no mqttserverurl defined" beim Boot.
#
# Uploaded by template 155-write-modbus2mqtt-config über
# upload_pre_start_file nach /config/modbus2mqtt/modbus2mqtt.yaml,
# BEVOR die LXC startet.
#
# Broker eclipse-mosquitto:8883 — bare hostname (LAN-DNS), SNI-Override
# zwingt TLS-Cert-Prüfung gegen den von addon-ssl für eclipse-mosquitto
# ausgestellten CN `eclipse-mosquitto`. Client-Cert aus addon-mtls
# in /ssl/mtls/modbus2mqtt/.
version: "0.1"
mqttbasetopic: modbus2mqtt
mqttdiscoveryprefix: homeassistant
mqttdiscoverylanguage: en
mqttusehassio: false
mqtt:
  url: mqtts://eclipse-mosquitto:8883
  clientId: modbus2mqtt
  tls:
    ca: /ssl/mtls/modbus2mqtt/chain.pem
    cert: /ssl/mtls/modbus2mqtt/cert.pem
    key: /ssl/mtls/modbus2mqtt/privkey.pem
    servername: eclipse-mosquitto
    rejectUnauthorized: true
httpport: 3000
fakeModbus: false
filelocation: /data
rootUrl: https://modbus2mqtt:3443/
debugComponents: mqttconnector
tcpBridgePort: 502

# Modbus-Geräte hierhin (siehe modbus2mqtt-Docs für Schema).
# devices: []
